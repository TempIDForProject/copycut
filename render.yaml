services:
  - type: web
    name: copycut-melp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FIREBASE_PROJECT
        value: copycut-000
      # ---- BotKeep PostgreSQL ----
      - key: PGHOST
        value: 195.32.64.31
      - key: PGPORT
        value: 8765
      - key: PGUSER
        value: botkeep
      - key: PGDATABASE
        value: app
      - key: DATABASE_SSL
        value: true
      - key: PGPASSWORD
        sync: false
      # ---- secrets ----
      - key: RZP_KEY_ID
        sync: false
      - key: RZP_KEY_SECRET
        sync: false
      - key: RZP_WEBHOOK_SECRET
        sync: false
      - key: RECEIPT_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
